name: "Release Tauri App"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.8.17)"
        required: false
        default: "v0.8.17"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            name: "windows"
            args: ""
          # macOS 必须显式带上 app target：只出 dmg 时 Tauri 不会生成 .app.tar.gz，
          # 自动更新就没有可分发的包（latest.json 也会缺 darwin 平台）。
          - platform: "macos-latest"
            name: "macos"
            args: "--bundles app,dmg"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "tauri-app/package.json"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: |
          cd tauri-app
          npm install

      # 前端语法自检放在编译 Rust 之前：语法错立刻 fail，不用等十几分钟的 release 构建
      - name: Check frontend syntax
        shell: bash
        run: |
          cd tauri-app
          npm run check

      # 上传链路的参数解析/状态统计有单测兜底：serde 字段名写错不会报错，
      # 只会静默变成空值（v0.8.10 的 window_label 事故就是这么来的）
      - name: Run Rust tests
        shell: bash
        run: |
          cd tauri-app/src-tauri
          cargo test --quiet

      # 自动更新的包必须签名，没有私钥 tauri 会直接报错。
      # 提前一步检查，省得等十几分钟编译完才失败。
      # 注意必须指定 bash：Windows runner 默认 pwsh，`[ -z "$KEY" ]` 会直接语法错误，
      # 表现为「只有 windows job 在这一步失败」，看着像 secret 没配。
      - name: Check updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY。到仓库 Settings → Secrets and variables → Actions 添加："
            echo "::error::TAURI_SIGNING_PRIVATE_KEY = ~/.tauri/kb-deskpet.key 的内容"
            exit 1
          fi
          echo "签名密钥已配置（长度 ${#KEY}）"

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./tauri-app"
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name != 'main' && github.ref_name || inputs.version || 'v0.8.17' }}
          releaseName: "知识小助 ${{ github.ref_name != 'main' && github.ref_name || inputs.version || 'v0.8.17' }}"
          releaseBody: "华夏国数知识小助桌面端最新发布包。"
          releaseDraft: false
          prerelease: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 知识小助-${{ matrix.name }}-build
          path: |
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe
            tauri-app/src-tauri/target/release/bundle/nsis/*.sig
            tauri-app/src-tauri/target/release/bundle/dmg/*.dmg
            tauri-app/src-tauri/target/release/bundle/macos/*.app
            tauri-app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            tauri-app/src-tauri/target/release/bundle/macos/*.sig
          if-no-files-found: warn

  # 自己拼 latest.json：tauri-action 的自动生成在「中文 productName」这套产物名下没生效
  # （资产被清洗成 `_aarch64.app.tar.gz`、`_0.8.17_x64-setup.exe`），这里直接读 release 里的
  # .sig 按平台写 url —— 客户端 updater 只认这一个文件。
  latest-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name != 'main' && github.ref_name || inputs.version || 'v0.8.17' }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$work"
          ls -l "$work"
          VERSION="${TAG#v}" WORK="$work" BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" python3 - <<'PY'
          import datetime, json, os, pathlib
          work = os.environ["WORK"]
          base = os.environ["BASE"]
          platforms = {}
          for p in pathlib.Path(work).iterdir():
              if p.suffix != ".sig":
                  continue
              asset = p.name[: -len(".sig")]
              sig = p.read_text().strip()
              if asset.endswith(".app.tar.gz"):
                  key = "darwin-aarch64" if "aarch64" in asset else "darwin-x86_64"
              elif asset.endswith(".exe") or asset.endswith(".msi"):
                  key = "windows-x86_64"
              else:
                  continue
              platforms[key] = {"signature": sig, "url": f"{base}/{asset}"}
          if not platforms:
              raise SystemExit("release 里没有找到 .sig，latest.json 不生成")
          doc = {
              "version": os.environ["VERSION"],
              "notes": "知识小助桌面端更新",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          pathlib.Path(work, "latest.json").write_text(json.dumps(doc, ensure_ascii=False, indent=2))
          print(json.dumps(doc, ensure_ascii=False, indent=2))
          PY
          gh release upload "$TAG" "$work/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
          echo "=== release 资产 ==="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
