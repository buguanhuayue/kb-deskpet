services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kb
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5433:5432"

  api:
    build: ./server
    env_file: .env
    volumes:
      - ./migrations:/app/migrations:ro
      - filedata:/data/files
    command: sh -c "python scripts/migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8088"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"

  worker:
    build: ./server
    env_file: .env
    volumes:
      - filedata:/data/files
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  filedata:
