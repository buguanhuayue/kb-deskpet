[package]
name = "kb-deskpet-tauri"
version = "0.1.0"
description = "kb-deskpet desktop wrapper"
authors = ["kb-deskpet"]
edition = "2021"
repository = ""
default-run = "kb-deskpet-tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
# multipart 用于真实文件上传；插件已经把 reqwest 重新导出，不必再引入一份
tauri-plugin-http = { version = "2", features = ["multipart", "json"] }
tauri-plugin-store = "2"
tokio = { version = "1", features = ["time"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
