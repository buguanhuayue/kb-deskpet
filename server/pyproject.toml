[project]
name = "kb-deskpet-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "jieba>=0.42",
  "pypdfium2>=4.30",
  "python-multipart>=0.0.9",
  "pgvector>=0.3",
]

[project.optional-dependencies]
# 测试依赖单独成组：生产镜像 `pip install -e .` 不会带上它们。
# 跑法见 tests/README.md —— `pip install -e ".[test]"` 后 `python3 -m pytest tests/ -v`
test = [
  "pytest>=8.0",
  "pytest-mock>=3.14",
]

[tool.setuptools]
packages = ["app"]
