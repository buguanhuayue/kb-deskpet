<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8' />
<meta name='viewport' content='width=device-width,initial-scale=1' />
<title>kb-deskpet · P0 验收台</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--text:#1b1f24;--muted:#6b7280;--accent:#2f6fed;--accent-bg:#eef3ff;--ok:#0f9960;--warn:#c2410c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(246,247,249,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 0;margin:0 -20px 20px;padding-left:20px;padding-right:20px;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .topbar h1{font-size:18px;margin:0}
  .topbar .actions{display:flex;gap:8px;align-items:center}
  .hero{background:var(--card);border:2px dashed var(--accent);border-radius:14px;padding:22px 18px;margin-bottom:16px;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-bg),transparent);pointer-events:none}
  .hero-inner{position:relative;display:flex;gap:16px;align-items:center}
  .hero-icon{width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px;flex-shrink:0}
  .hero-main{flex:1}
  .hero-title{font-size:16px;font-weight:700;margin:0 0 4px}
  .hero-sub{font-size:13px;color:var(--muted);margin:0 0 12px}
  .hero-cta{display:flex;gap:8px;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input[type=text],input[type=password],textarea{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit}
  textarea{width:100%;min-height:80px;resize:vertical}
  button{padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;font:inherit;cursor:pointer;font-weight:600}
  button.ghost{background:#fff;color:var(--accent)}
  button.big{padding:12px 20px;font-size:14px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .tag{font-size:12px;padding:2px 7px;border-radius:999px;background:#eef2ff;color:#3b4fd8}
  .tag.ok{background:#e7f6ee;color:var(--ok)} .tag.bad{background:#fdecea;color:#b42318}
  .ans{white-space:pre-wrap;min-height:20px}
  .cite{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:13px;color:var(--muted)}
  .cite b{color:var(--text);font-weight:600}
  .drop{border:1.5px dashed transparent;border-radius:9px;padding:0;text-align:left;color:var(--muted)}
  .drop.over{outline:2px solid var(--accent);outline-offset:2px;background:#f5f8ff}
  .list{font-size:13px;color:var(--muted);margin-top:12px}
  .list div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #f0f2f4}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
  .tab.active{background:var(--text);color:#fff;border-color:var(--text)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  #globalDrop{position:fixed;inset:0;background:rgba(47,111,237,0.08);border:4px dashed var(--accent);display:none;place-items:center;z-index:100;font-size:18px;font-weight:700;color:var(--accent)}
  #globalDrop.show{display:grid}
</style>
</head>
<body>
<div id='globalDrop'>松开即可存入资料</div>
<div class='wrap'>
  <div class='topbar'>
    <h1>kb-deskpet · 知识库</h1>
    <div class='actions'>
      <input id='token' type='password' placeholder='API token' style='width:160px' />
      <button class='ghost' onclick='saveToken()'>记住</button>
      <button class='ghost' onclick='checkHealth()'>自检</button>
      <span id='health' class='tag'>未检查</span>
    </div>
  </div>

  <!-- 主入口：存入资料 -->
  <div class='hero' id='hero'>
    <div class='hero-inner'>
      <div class='hero-icon'>+</div>
      <div class='hero-main'>
        <p class='hero-title'>存入资料 · 拖拽即入库</p>
        <p class='hero-sub'>支持 PDF / TXT / MD / CSV，200MB 内，自动解析切片，支持页码引用。整个窗口都可拖拽。</p>
        <div class='hero-cta'>
          <button class='big' onclick='document.getElementById("file").click()'>选择文件</button>
          <button class='ghost big' onclick='toggleText()'>粘贴文本</button>
          <span id='uploadStatus' class='tag' style='display:none'></span>
        </div>
        <div class='hint'>已支持去重：同部门同内容不会重复入库。扫描件暂不支持 OCR。</div>
        <div id='textBox' style='display:none;margin-top:12px'>
          <textarea id='textContent' placeholder='粘贴一段制度、会议纪要、周报...'></textarea>
          <div class='row' style='margin-top:8px'>
            <input id='textTitle' type='text' placeholder='标题（可选）' />
            <button onclick='uploadText()'>存入文本</button>
          </div>
        </div>
      </div>
    </div>
    <input id='file' type='file' accept='.pdf,.txt,.md,.csv' hidden />
  </div>

  <div class='card'>
    <div class='row' style='justify-content:space-between'>
      <b>已入库</b>
      <span style='font-size:12px;color:var(--muted)'>仅显示你有权限的</span>
    </div>
    <div class='list' id='docs'><div>未加载</div></div>
  </div>

  <div class='card'>
    <div class='row'>
      <input id='q' type='text' placeholder='问点什么，例如：差旅报销的标准是多少？' />
      <button id='ask' onclick='ask()'>提问</button>
    </div>
    <div class='ans' id='ans'></div>
    <div class='cite' id='cite'></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const tokenEl = $('#token');
tokenEl.value = localStorage.getItem('kb_token') || '';

function saveToken(){ localStorage.setItem('kb_token', tokenEl.value.trim()); flash('已记住'); }
function flash(msg){ const h=$('#health'); h.textContent=msg; setTimeout(checkHealth, 1200); }
const H = () => ({ 'Authorization': 'Bearer ' + tokenEl.value.trim() });

async function checkHealth(){
  const h = $('#health');
  try{
    const r = await fetch('/api/health');
    const d = await r.json();
    const bad = d.db !== 'ok' || d.embed !== 'configured';
    h.textContent = 'db:'+d.db+' · embed:'+d.embed;
    h.className = 'tag ' + (bad ? 'bad' : 'ok');
  }catch(e){ h.textContent = '服务未启动'; h.className='tag bad'; }
}

function toggleText(){
  const b = $('#textBox');
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
}

// 全局拖拽
const globalDrop = $('#globalDrop');
let dragCounter = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; globalDrop.classList.add('show'); });
window.addEventListener('dragleave', e => { e.preventDefault(); dragCounter--; if(dragCounter<=0){ globalDrop.classList.remove('show'); dragCounter=0; } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); globalDrop.classList.remove('show'); dragCounter=0;
  const f = e.dataTransfer.files[0];
  if(f) upload(f);
});

const fileEl = $('#file');
fileEl.onchange = () => upload(fileEl.files[0]);

async function upload(f){
  if(!f) return;
  const st = $('#uploadStatus'); st.style.display='inline-block'; st.textContent='上传中：'+f.name+' ...'; st.className='tag';
  const fd = new FormData(); fd.append('file', f);
  try{
    const r = await fetch('/api/ingest/file', {method:'POST', headers:H(), body:fd});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail?.message || JSON.stringify(d));
    st.textContent = d.deduped ? '内容重复，已复用' : '已入队，处理中...';
    poll(d.doc_id, st);
  }catch(e){ st.textContent='失败：'+e.message; st.className='tag bad'; }
}

async function uploadText(){
  const content = $('#textContent').value.trim();
  const title = $('#textTitle').value.trim() || '文本-'+new Date().toISOString().slice(0,10);
  if(!content){ alert('请先粘贴内容'); return; }
  const st = $('#uploadStatus'); st.style.display='inline-block'; st.textContent='上传中...';
  try{
    const r = await fetch('/api/ingest/text', {method:'POST', headers:{...H(), 'Content-Type':'application/json'}, body:JSON.stringify({title, content})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail?.message || JSON.stringify(d));
    st.textContent='已入队：'+title;
    poll(d.doc_id, st);
    $('#textContent').value=''; $('#textTitle').value='';
  }catch(e){ st.textContent='失败：'+e.message; st.className='tag bad'; }
}

async function poll(id, st){
  for(let i=0;i<120;i++){
    await new Promise(r=>setTimeout(r,1500));
    const r = await fetch('/api/documents/'+id, {headers:H()});
    const d = await r.json();
    st.textContent = d.title+' · '+d.status+' · '+(d.chunk_count||0)+' 片';
    st.className='tag '+(d.status==='ready'?'ok':d.status==='failed'?'bad':'');
    if(d.status==='ready' || d.status==='failed'){ loadDocs(); if(d.status==='failed') st.textContent += ' · '+(d.error_msg||''); return; }
  }
}

async function loadDocs(){
  try{
    const r = await fetch('/api/documents', {headers:H()});
    const d = await r.json();
    $('#docs').innerHTML = (d.items||[]).slice(0,10).map(x =>
      '<div><span>'+x.title+'</span><span>'+x.status+' · '+x.chunk_count+' 片</span></div>').join('') || '<div>暂无文档，拖个PDF进来试试</div>';
  }catch(e){ $('#docs').innerHTML='<div>加载失败：'+e.message+'</div>'; }
}

async function ask(){
  const q = $('#q').value.trim(); if(!q) return;
  $('#ans').textContent = ''; $('#cite').innerHTML = ''; $('#ask').disabled = true;
  try{
    const r = await fetch('/api/query', {
      method:'POST', headers:{...H(), 'Content-Type':'application/json'},
      body: JSON.stringify({question:q})
    });
    if(!r.ok){ throw new Error(await r.text()); }
    const reader = r.body.getReader(); const dec = new TextDecoder();
    let buf = '', text = '';
    while(true){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for(const p of parts){
        const ev = (p.match(/^event: (.+)$/m)||[])[1];
        const data = (p.match(/^data: ([\s\S]+)$/m)||[])[1];
        if(!ev || !data) continue;
        if(ev==='token'){ text += JSON.parse(data).delta || ''; $('#ans').textContent = text; }
        else if(ev==='citations'){ render(JSON.parse(data)); }
        else if(ev==='error'){ $('#ans').textContent = text + '\n\n[出错] ' + JSON.parse(data).message; }
      }
    }
  }catch(e){ $('#ans').textContent = '请求失败：' + e.message; }
  finally{ $('#ask').disabled = false; }
}

function render(list){
  if(!list || !list.length){ $('#cite').textContent = '（没有引用）'; return; }
  $('#cite').innerHTML = list.map(c =>
    '<div style="margin-bottom:6px">['+c.index+'] <b>'+c.title+'</b> '+c.locator_text+' · 分数 '+c.score+'</div>').join('');
}

checkHealth(); tokenEl.value && loadDocs();
</script>
</body>
</html>
